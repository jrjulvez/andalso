# Publica el intermediario (proxy/worker.js) en Cloudflare cada vez que cambia.
# Necesita un secreto del repositorio: CLOUDFLARE_API_TOKEN
# (plantilla «Edit Cloudflare Workers» en Cloudflare → My Profile → API Tokens).
# Las variables y secretos que ya tiene el Worker (ANTHROPIC_API_KEY, CODIGO) no se tocan.
name: Publicar intermediario
on:
  push:
    branches: [main]
    paths: ['proxy/**', '.github/workflows/worker.yml']
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Comprobar el token
        env: { CF: '${{ secrets.CLOUDFLARE_API_TOKEN }}' }
        run: |
          if [ -z "$CF" ]; then echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN en GitHub"; exit 1; fi
      - name: Cuenta y almacén de piezas (KV)
        id: kv
        env: { CF: '${{ secrets.CLOUDFLARE_API_TOKEN }}' }
        run: |
          api() { curl -sS -H "Authorization: Bearer $CF" -H "content-type: application/json" "$@"; }
          ACC=$(api https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          [ -n "$ACC" ] && [ "$ACC" != "null" ] || { echo "::error::El token no ve ninguna cuenta"; exit 1; }
          ID=$(api "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title=="andalso-piezas") | .id' | head -1)
          if [ -z "$ID" ]; then
            ID=$(api -X POST "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces" -d '{"title":"andalso-piezas"}' | jq -r '.result.id')
            echo "Creado el almacén andalso-piezas"
          fi
          [ -n "$ID" ] && [ "$ID" != "null" ] || { echo "::error::No he podido crear el almacén KV"; exit 1; }
          echo "acc=$ACC" >> "$GITHUB_OUTPUT"; echo "kv=$ID" >> "$GITHUB_OUTPUT"
      - name: Configuración
        run: |
          cat > proxy/wrangler.toml <<EOF
          name = "andalso"
          main = "worker.js"
          compatibility_date = "2025-01-01"
          account_id = "${{ steps.kv.outputs.acc }}"
          workers_dev = true
          keep_vars = true

          [[kv_namespaces]]
          binding = "PIEZAS"
          id = "${{ steps.kv.outputs.kv }}"
          EOF
      - name: Publicar
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}' }
        run: npx --yes wrangler@4 deploy --config proxy/wrangler.toml
      - name: Comprobar que responde
        run: |
          sleep 5
          curl -sS https://andalso.jrjulvez.workers.dev/ | tee /tmp/r.json
          grep -q '"enlaces_cortos":true' /tmp/r.json && echo "OK: intermediario nuevo con enlaces cortos"
