<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F4F1">
<meta name="description" content="Lo que te llega es una parte. Cuenta el resto.">
<title>and also</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="and also">
<style>
@font-face{font-family:'Archivo';src:url(fonts/archivo.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%;font-display:swap}
:root{--ink:#111111;--paper:#F4F4F1;--fluo:#E4FF1A;--grey:#5C5B57;--soft:#6E6C67;--line:#B9B7B1;--white:#FFFFFF}
*{box-sizing:border-box}
html,body{margin:0;background:#E9E8E4;color:var(--ink);font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,textarea,select{font-family:inherit;color:inherit}
a{color:inherit}
#app{max-width:460px;min-height:100vh;min-height:100dvh;margin:0 auto;background:var(--paper);display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top)}
.hl{position:relative;display:inline-block}
.hl .hlb{position:absolute;left:-.08em;right:-.12em;top:.16em;bottom:.02em;background:var(--fluo);transform:rotate(-1.4deg) skewX(-10deg);border-radius:.06em .22em .1em .28em}
.hl .hlt{position:relative;color:#111111}
.es,.medias,.dicho{text-decoration:none;padding-bottom:.04em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.es{border-bottom:.09em solid currentColor}
.medias{border-bottom:.12em dotted currentColor}
.dicho{border-bottom:.09em dashed currentColor}
.no{text-decoration:line-through;text-decoration-thickness:.11em}
.sin .t{color:var(--soft)}
.lab{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.small{font-size:13px;color:var(--grey)}
.btn{min-height:44px;padding:0 14px;border:2px solid var(--ink);background:transparent;font-size:15px;font-weight:600;cursor:pointer;border-radius:0}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.on{background:var(--fluo)}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,.tramo:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.seg{display:flex}.seg .btn{flex:1 1 0;margin-right:-2px;min-height:40px;font-size:14px;padding:0 6px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px 10px}
.logo{font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.pad{padding:18px 20px 24px}
.card{background:var(--white);border:2px solid var(--ink);padding:14px 16px}
.tramo{padding:0;border:0;background:transparent;font:inherit;cursor:pointer;text-align:left}
.tramo.sel{background:var(--fluo)}
main{flex:1 1 auto}
.bar{position:sticky;bottom:0;border-top:2px solid var(--ink);background:var(--white);padding:10px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:3}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips .btn{flex:none;min-height:36px;padding:0 10px;font-size:13px}
.chips .btn.done{color:var(--soft);border-color:var(--line)}
.row{display:grid;grid-template-columns:26px minmax(0,1fr);column-gap:10px}
.spine{display:flex;justify-content:center}.spine i{width:0;border-left:3px solid var(--ink)}
.sheetbg{position:fixed;inset:0;background:rgba(17,17,17,.45);display:flex;justify-content:center;align-items:flex-end;z-index:10}
.sheet{width:100%;max-width:460px;max-height:88vh;overflow-y:auto;background:var(--paper);border-top:2px solid var(--ink);padding:10px 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.grab{align-self:center;width:44px;height:5px;background:var(--line);border-radius:3px}
.list{border-bottom:2px solid var(--ink)}.list>div,.list>li{border-top:2px solid var(--ink);padding:9px 0}
textarea{width:100%;min-height:110px;border:2px solid var(--ink);background:var(--white);padding:12px;font-size:16px;line-height:1.4;resize:vertical;border-radius:0}
input[type=text],input[type=password],select{width:100%;min-height:46px;padding:0 12px;border:2px solid var(--ink);background:var(--white);font-size:16px;border-radius:0}
.bar input[type=text]{flex:1 1 auto;width:auto;min-width:0;background:var(--paper)}
.slides{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 20px 14px}
.slidebox{flex:none;scroll-snap-align:center;overflow:hidden;border:2px solid var(--ink)}
.slide{width:1080px;height:1350px;transform-origin:0 0;padding:64px 72px 60px;display:flex;flex-direction:column;font-family:'Archivo',sans-serif;box-sizing:border-box}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.think{display:inline-block;animation:p 1s infinite alternate}@keyframes p{from{opacity:.35}to{opacity:1}}
.aviso{background:var(--fluo);border:2px solid var(--ink);padding:12px 14px;font-size:15px;line-height:1.4}
.err{border:2px solid var(--ink);background:var(--white);padding:12px 14px;font-size:15px;line-height:1.4}
#export{position:fixed;left:-20000px;top:0}
@media (prefers-reduced-motion:reduce){.think{animation:none}}
</style>
</head>
<body>
<div id="app"><p style="padding:20px">Cargando…</p></div>
<div id="export" aria-hidden="true"></div>
<script src="vendor/lz-string.min.js"></script>
<script src="vendor/html2canvas.min.js"></script>
<script src="config.js"></script>
<script src="motor.js"></script>
<script src="demo.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}</script>
</body>
</html>
